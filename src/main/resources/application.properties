# Server Configuration
server.port=8080

# Application Name
spring.application.name=MorapackBackend

# Data Paths
app.data.aeropuertos-path=data/aeropuertos.csv
app.data.vuelos-path=data/vuelos.txt
app.data.pedidos-path=data/pedidos_m.txt

# GRASP Configuration
grasp.alpha=0.3
grasp.tamano-rcl=3

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://morapack.cwzuzoklvdk8.us-east-1.rds.amazonaws.com:3306/morapack?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logging
logging.level.com.morapack=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Encoding
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true