# Server Configuration
server.port=8080

# Application Name
spring.application.name=MorapackBackend

# Data Paths
app.data.aeropuertos-path=data/aeropuertos.csv
app.data.vuelos-path=data/vuelos.txt
app.data.pedidos-path=data/pedidos_m.txt

# GRASP Configuration
grasp.alpha=0.3
grasp.tamano-rcl=3

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://morapack.ct84ne3crtdj.us-east-1.rds.amazonaws.com:3306/morapack?rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Optimizacion de batch inserts
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Logging
logging.level.com.morapack=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Encoding
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.datasource.hikari.auto-commit=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

